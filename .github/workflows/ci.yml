name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The Rust toolchain is pinned in rust-toolchain.toml. Jobs install exactly that
# toolchain instead of floating `stable`, so a new compiler or Clippy release
# cannot turn the build red without a deliberate bump.

jobs:
  # Plain compile and test per platform. Kept separate from `lint` so a Clippy
  # or formatting failure can never hide a platform build break (and vice versa).
  build-test:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev
      # Windows builds for x86_64-pc-windows-gnu, the target HTSlib compiles for (MinGW). The
      # alignment benchmark is left out there: its HTSlib-over-HTTP workload needs OpenSSL.
      - name: Windows MinGW toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-mingw
      - run: cargo build --workspace ${{ runner.os == 'Windows' && '--exclude rgv-alignment-bench' || '' }} --locked
      - run: cargo test --workspace ${{ runner.os == 'Windows' && '--exclude rgv-alignment-bench' || '' }} --locked --no-fail-fast
      - name: Test package staging, SBOM, provenance, and manifests
        run: python -m unittest discover -s packaging/tests -v

  lint:
    name: fmt and clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev
      # Windows builds for x86_64-pc-windows-gnu, the target HTSlib compiles for (MinGW). The
      # alignment benchmark is left out there: its HTSlib-over-HTTP workload needs OpenSSL.
      - name: Windows MinGW toolchain
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-mingw
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace ${{ runner.os == 'Windows' && '--exclude rgv-alignment-bench' || '' }} --all-targets --locked -- -D warnings

  linux-gates:
    name: fuzz-target compile and remote range budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      - name: Enforce remote range request and byte budgets
        run: |
          cargo run --locked --release -p rgv-alignment-bench -- generate
          cargo run --locked --release -p rgv-remote-range-bench -- --latency-ms 5
