name: Development release artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --locked --release -p rgv-desktop -p rgv-mcp
      - name: Stage macOS application bundle
        if: runner.os == 'macOS'
        run: |
          python3 packaging/stage_package.py --platform macos --architecture "$(uname -m)" --version 0.1.0 --build-number "$GITHUB_RUN_NUMBER" --binary target/release/rgv-desktop --mcp-binary target/release/rgv-mcp --destination dist/stage
          ditto -c -k --sequesterRsrc --keepParent dist/stage/RGV.app "dist/RGV-macos-$(uname -m)-development-unsigned.zip"
      - name: Stage Linux tarball
        if: runner.os == 'Linux'
        run: |
          python3 packaging/stage_package.py --platform linux --architecture x86_64 --version 0.1.0 --build-number "$GITHUB_RUN_NUMBER" --binary target/release/rgv-desktop --mcp-binary target/release/rgv-mcp --destination dist/stage
          tar -C dist/stage -czf dist/RGV-linux-x86_64-development-unsigned.tar.gz RGV-linux-x86_64
      - name: Stage Windows portable package and MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/stage_package.py --platform windows --architecture x86_64 --version 0.1.0 --build-number $env:GITHUB_RUN_NUMBER --binary target/release/rgv-desktop.exe --mcp-binary target/release/rgv-mcp.exe --destination dist/stage
          Compress-Archive -Path dist/stage/RGV-windows-x86_64 -DestinationPath dist/RGV-windows-x86_64-development-unsigned.zip
          dotnet build packaging/windows/RGV.wixproj -c Release -p:RgvVersion=0.1.0 -p:RgvBinary="$env:GITHUB_WORKSPACE\dist\stage\RGV-windows-x86_64\rgv-desktop.exe" -p:RgvMcpBinary="$env:GITHUB_WORKSPACE\dist\stage\RGV-windows-x86_64\rgv-mcp.exe" -p:RgvPackageRoot="$env:GITHUB_WORKSPACE\dist\stage\RGV-windows-x86_64" -p:RgvResources="$env:GITHUB_WORKSPACE\dist\stage\RGV-windows-x86_64\licenses" -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: rgv-${{ runner.os }}-development-unsigned
          path: dist/RGV-*
          if-no-files-found: error
