name: Release

# Unsigned release packages for macOS, Windows and Linux.
#
# - Pushing a tag `vX.Y.Z` builds every package and publishes them as a GitHub release.
# - Running the workflow by hand ("Run workflow" on the Actions page, or
#   `gh workflow run release.yml`) builds the same packages as a dry run: they are attached to
#   the run as artifacts and nothing is published.
#
# The packages are not signed with an Apple Developer ID or a Windows code-signing certificate.
# The macOS app is ad-hoc signed (so Apple silicon runs it and Gatekeeper offers "Open Anyway"
# rather than calling it damaged); Windows SmartScreen asks once before running it.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # A tag names the version; a manual run is a development build of the workspace version.
  RGV_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --locked --profile dist -p rgv-desktop -p rgv-mcp
      # Staging lists the whole locked dependency graph offline for the SBOM; fetch every
      # package, not only those this build compiled.
      - run: cargo fetch --locked
      - name: Build ad-hoc signed app and disk image
        env:
          RGV_ARCH: ${{ matrix.architecture }}
        run: |
          python3 packaging/stage_package.py --platform macos --architecture "$RGV_ARCH" --version "${RGV_VERSION#v}" --build-number "$GITHUB_RUN_NUMBER" --binary target/dist/rgv-desktop --mcp-binary target/dist/rgv-mcp --destination dist/stage
          codesign --force --sign - dist/stage/RGV.app/Contents/MacOS/rgv-mcp
          codesign --force --sign - dist/stage/RGV.app
          codesign --verify --deep --strict --verbose=2 dist/stage/RGV.app
          cp dist/stage/RGV.app/Contents/Resources/RGV.cdx.json "dist/RGV-macos-$RGV_ARCH.cdx.json"
          cp dist/stage/RGV.app/Contents/Resources/BUILD-PROVENANCE.json "dist/RGV-macos-$RGV_ARCH.provenance.json"
          hdiutil create -volname RGV -srcfolder dist/stage/RGV.app -ov -format UDZO "dist/RGV-macos-$RGV_ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: rgv-macos-${{ matrix.architecture }}
          path: |
            dist/*.dmg
            dist/*.cdx.json
            dist/*.provenance.json
          if-no-files-found: error

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      # HTSlib builds with MinGW, not MSVC: Windows packages are x86_64-pc-windows-gnu, linked
      # by MSYS2's UCRT64 GCC (the C runtime Windows 10 and 11 ship) and self-contained.
      - uses: ./.github/actions/windows-mingw
      - run: cargo build --locked --profile dist --target ${{ env.RGV_TARGET }} -p rgv-desktop -p rgv-mcp
      - name: Check the executables need only system DLLs
        shell: bash
        run: |
          for exe in rgv-desktop rgv-mcp; do
            dlls=$(objdump -p "target/$RGV_TARGET/dist/$exe.exe" | awk '/DLL Name/ {print tolower($3)}' | sort -u)
            echo "$exe imports:"; echo "$dlls"
            if echo "$dlls" | grep -E '^(libgcc|libstdc|libwinpthread|libhts|zlib|libdeflate)'; then
              echo "::error::$exe depends on a MinGW DLL that is not shipped"; exit 1
            fi
          done
      # Staging lists the whole locked dependency graph offline for the SBOM; fetch every
      # package, not only those this build compiled.
      - run: cargo fetch --locked
      - name: Build MSI installer and portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = "$env:RGV_VERSION".TrimStart("v")
          python packaging/stage_package.py --platform windows --architecture x86_64 --version $version --build-number $env:GITHUB_RUN_NUMBER --binary target/$env:RGV_TARGET/dist/rgv-desktop.exe --mcp-binary target/$env:RGV_TARGET/dist/rgv-mcp.exe --destination dist/stage
          if ($LASTEXITCODE -ne 0) { throw "staging failed" }
          $packageRoot = "$env:GITHUB_WORKSPACE\dist\stage\RGV-windows-x86_64"
          dotnet build packaging\windows\RGV.wixproj -c Release -p:RgvVersion=$version -p:RgvBinary="$packageRoot\rgv-desktop.exe" -p:RgvMcpBinary="$packageRoot\rgv-mcp.exe" -p:RgvPackageRoot=$packageRoot -p:RgvResources="$packageRoot\licenses" -o dist
          if ($LASTEXITCODE -ne 0) { throw "MSI build failed" }
          Copy-Item "$packageRoot\licenses\RGV.cdx.json" dist\RGV-windows-x86_64.cdx.json
          Copy-Item "$packageRoot\licenses\BUILD-PROVENANCE.json" dist\RGV-windows-x86_64.provenance.json
          Compress-Archive -Path $packageRoot -DestinationPath dist\RGV-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rgv-windows-x86_64
          path: |
            dist/RGV-windows-x86_64.msi
            dist/RGV-windows-x86_64.zip
            dist/RGV-windows-x86_64.cdx.json
            dist/RGV-windows-x86_64.provenance.json
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --locked --profile dist -p rgv-desktop -p rgv-mcp
      # Staging lists the whole locked dependency graph offline for the SBOM; fetch every
      # package, not only those this build compiled.
      - run: cargo fetch --locked
      - name: Package tarball
        run: |
          python3 packaging/stage_package.py --platform linux --architecture x86_64 --version "${RGV_VERSION#v}" --build-number "$GITHUB_RUN_NUMBER" --binary target/dist/rgv-desktop --mcp-binary target/dist/rgv-mcp --destination dist/stage
          cp dist/stage/RGV-linux-x86_64/share/doc/rgv/RGV.cdx.json dist/RGV-linux-x86_64.cdx.json
          cp dist/stage/RGV-linux-x86_64/share/doc/rgv/BUILD-PROVENANCE.json dist/RGV-linux-x86_64.provenance.json
          tar -C dist/stage -czf dist/RGV-linux-x86_64.tar.gz RGV-linux-x86_64
      - name: Package AppImage with pinned tool
        env:
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        run: |
          mkdir -p dist/RGV.AppDir/usr/bin
          cp dist/stage/RGV-linux-x86_64/bin/rgv-desktop dist/RGV.AppDir/usr/bin/
          cp dist/stage/RGV-linux-x86_64/bin/rgv-mcp dist/RGV.AppDir/usr/bin/
          cp -R dist/stage/RGV-linux-x86_64/share dist/RGV.AppDir/usr/
          cp packaging/linux/AppRun dist/RGV.AppDir/AppRun
          cp packaging/linux/rgv.desktop dist/RGV.AppDir/rgv.desktop
          cp packaging/linux/rgv.svg dist/RGV.AppDir/rgv.svg
          chmod +x dist/RGV.AppDir/AppRun
          curl --fail --location https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage --output "$RUNNER_TEMP/appimagetool"
          echo "$APPIMAGETOOL_SHA256  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 VERSION="${RGV_VERSION#v}" "$RUNNER_TEMP/appimagetool" --no-appstream dist/RGV.AppDir dist/RGV-linux-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: rgv-linux-x86_64
          path: |
            dist/RGV-linux-x86_64.tar.gz
            dist/RGV-linux-x86_64.AppImage
            dist/RGV-linux-x86_64.cdx.json
            dist/RGV-linux-x86_64.provenance.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum RGV-* > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          ## Installing

          These packages are not signed with an Apple or Microsoft certificate, so each system asks once before opening RGV.

          - **macOS** (`RGV-macos-arm64.dmg` for Apple silicon, `RGV-macos-x86_64.dmg` for Intel): drag RGV to Applications and open it. When macOS says it cannot verify the developer, open System Settings → Privacy & Security and click **Open Anyway**. Or run `xattr -dr com.apple.quarantine /Applications/RGV.app` once.
          - **Windows** (`RGV-windows-x86_64.msi`, or the portable `.zip`): when SmartScreen says "Windows protected your PC", click **More info → Run anyway**.
          - **Linux** (`RGV-linux-x86_64.AppImage`, or the `.tar.gz`): `chmod +x RGV-linux-x86_64.AppImage` and run it.

          `SHA256SUMS` lists every file's checksum.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --notes-file notes.md --title "RGV $GITHUB_REF_NAME"
