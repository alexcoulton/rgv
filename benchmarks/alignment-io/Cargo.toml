[package]
name = "rgv-alignment-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
clap.workspace = true
noodles.workspace = true
noodles-bgzf.workspace = true
noodles110.workspace = true
reqwest.workspace = true
rsomics-bamio.workspace = true
# `curl` only for the `rust-htslib-http` comparison workload; nothing else in the workspace lets
# HTSlib open a URL, so the workspace dependency itself no longer needs the feature.
rust-htslib = { workspace = true, features = ["curl"] }
serde.workspace = true
serde_json.workspace = true
tiny_http.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true
rgv-core = { version = "0.1.0", path = "../../crates/rgv-core" }
rgv-hts = { version = "0.1.0", path = "../../crates/rgv-hts" }
