[package]
name = "rgv-desktop"
version = "0.1.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["diagnostics"]
# Interaction recording, the latency and manual diagnostic traces and the stress-health
# publisher. Without it the `Diagnostics` facade compiles to no-ops.
diagnostics = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
flate2.workspace = true
image.workspace = true
pollster.workspace = true
rfd.workspace = true
rgv-alignment-scene = { version = "0.1.0", path = "../../crates/rgv-alignment-scene" }
rgv-automation = { version = "0.1.0", path = "../../crates/rgv-automation" }
rgv-core = { version = "0.1.0", path = "../../crates/rgv-core" }
rgv-engine = { version = "0.1.0", path = "../../crates/rgv-engine" }
rgv-hts = { version = "0.1.0", path = "../../crates/rgv-hts" }
rgv-layout = { version = "0.1.0", path = "../../crates/rgv-layout" }
rgv-model = { version = "0.1.0", path = "../../crates/rgv-model" }
rgv-render = { version = "0.1.0", path = "../../crates/rgv-render" }
rgv-session = { version = "0.1.0", path = "../../crates/rgv-session" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tiny_http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
wgpu.workspace = true
winit.workspace = true

# The system pointer's location, to tell a covered window from a pointer that left it. Already
# in the build through winit.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"

[lints]
workspace = true
