[package]
name = "rgv-automation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Derives `schemars::JsonSchema` on the automation types that `rgv-mcp` publishes as tool
# argument schemas, so those schemas cannot drift from the wire types.
schema = ["dep:schemars", "rgv-core/schema"]

[dependencies]
rgv-core = { version = "0.1.0", path = "../rgv-core" }
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
